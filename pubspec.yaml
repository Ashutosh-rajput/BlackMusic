name: pixel_player
description: Privacy-first music player built with Flutter

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & BLoC
  flutter_bloc: ^9.0.0
  equatable: ^2.0.5
  rxdart: ^0.27.7

  # Service Locator & DI
  get_it: ^8.0.0

  # Database
  sqflite: ^2.3.3
  drift: ^2.18.0
  drift_flutter: ^0.2.0

  # Audio Playback
  just_audio: ^0.9.42
  audio_session: ^0.1.16

  # File & Storage
  path_provider: ^2.1.1
  permission_handler: ^11.3.1

  # Image Loading & Caching
  cached_network_image: ^3.3.1

  # UI & Material Design
  material_color_utilities: ^0.11.1
  google_fonts: ^6.2.1

  # Settings & Preferences
  shared_preferences: ^2.2.2

  # Utilities
  intl: ^0.19.0
  logger: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.9
  drift_dev: ^2.18.0
  bloc_test: ^9.1.7

flutter:
  uses-material-design: true
